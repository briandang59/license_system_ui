services:
  admin:
    image: license-system-admin:local
    build:
      context: .
      args:
        APP: admin
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    environment:
      APP_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3001}
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://host.docker.internal:5000/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  web:
    image: license-system-web:local
    build:
      context: .
      args:
        APP: web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_BASE_URL: ${DOCKER_API_BASE_URL:-http://host.docker.internal:5000/api/v1}
      SALES_CONTACT_URL: ${SALES_CONTACT_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
